            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            background: rgba(255, 255, 255, 0.98);

<link rel="me" href="https://www.blogger.com/profile/18110309435231374074" />

<body class="min-h-screen flex items-center justify-center p-4">

    <div id="chat-container" class="glass-card w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-rose-500 flex items-center justify-center text-white font-black text-xl shadow-inner">J</div>
                <div>
                    <h2 class="font-bold text-slate-900 text-lg">Jessica</h2>
                    <div class="flex items-center gap-1.5 text-xs text-emerald-600 font-semibold">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Online Now
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Content -->
        <div class="p-6 space-y-6">
            <div class="bg-slate-900 p-5 rounded-2xl rounded-bl-none text-white shadow-md text-2xl leading-tight font-black tracking-tight">
                Hey! I just noticed you live nearby. Are you free to chat right now?
            </div>

            <div id="action-buttons" class="space-y-3">
                <button onclick="handleRedirect()" class="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-extrabold text-lg rounded-2xl transition-all shadow-lg shadow-rose-300 active:scale-95">
                    Yes, let's chat!
                </button>
                <button onclick="handleRedirect()" class="w-full py-4 bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-bold text-lg rounded-2xl transition-all active:scale-95">
                    Tell me more first
                </button>
            </div>
        </div>
    </div>

    <script>
        const backgrounds = [
            "https://shorturl.at/WjAqW",
            "https://shorturl.at/FIXjW",
            "https://shorturl.at/5sAKT",
            "https://shorturl.at/xU28D"
        ];

        window.onload = function() {
            const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage = `url('${randomBg}')`;
        };

        function handleRedirect() {
            window.location.href = "https://p8f9a.bemobtrcks.com/click";
        }
    </script>
